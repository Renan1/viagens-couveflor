<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viagens · Couve Flor</title>
<meta name="theme-color" content="#0B1D2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  /* Redesign v3 — tokens de cor. Escuro é o padrão; claro segue o aparelho ou a escolha no botão de tema. */
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --r-sm:8px; --r-md:14px; --r-lg:20px; --r-sheet:26px;
    --rapido:.18s ease;
    --bg:#0B1D2A; --surf:#13283A; --surf2:#1B3245; --hover:#223F57;
    --borda:rgba(255,255,255,.08); --borda-forte:rgba(255,255,255,.16);
    --texto:#EEF5F9; --muted:#A3B8C6; --subtle:#7C93A3;
    --ida:#FFC53D; --ida-bg:rgba(255,197,61,.12);
    --volta:#2DD4BF; --volta-bg:rgba(45,212,191,.12);
    --extra:#A7BACB; --extra-bg:rgba(167,186,203,.12);
    --pix:#34D399; --pix-bg:rgba(52,211,153,.12);
    --perigo:#F87171; --perigo-bg:rgba(248,113,113,.14);
    --alerta:#F59E0B; --alerta-bg:rgba(245,158,11,.14);
    --brilho:0 0 24px rgba(45,212,191,.18);
    --contra:#0B1D2A;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){ :root:not([data-tema="escuro"]){
    --bg:#F2F6F8; --surf:#FFFFFF; --surf2:#F7FAFC; --hover:#EBF1F5;
    --borda:rgba(10,30,45,.09); --borda-forte:rgba(10,30,45,.18);
    --texto:#14283A; --muted:#4A6070; --subtle:#7A90A0;
    --ida:#D98200; --ida-bg:rgba(217,130,0,.1);
    --volta:#0D9488; --volta-bg:rgba(13,148,136,.1);
    --extra:#475D72; --extra-bg:rgba(71,93,114,.1);
    --pix:#059669; --pix-bg:rgba(5,150,105,.1);
    --perigo:#DC2626; --perigo-bg:rgba(220,38,38,.1);
    --alerta:#B45309; --alerta-bg:rgba(180,83,9,.1);
    --brilho:0 0 20px rgba(13,148,136,.15);
    color-scheme:light;
  }}
  :root[data-tema="claro"]{
    --bg:#F2F6F8; --surf:#FFFFFF; --surf2:#F7FAFC; --hover:#EBF1F5;
    --borda:rgba(10,30,45,.09); --borda-forte:rgba(10,30,45,.18);
    --texto:#14283A; --muted:#4A6070; --subtle:#7A90A0;
    --ida:#D98200; --ida-bg:rgba(217,130,0,.1);
    --volta:#0D9488; --volta-bg:rgba(13,148,136,.1);
    --extra:#475D72; --extra-bg:rgba(71,93,114,.1);
    --pix:#059669; --pix-bg:rgba(5,150,105,.1);
    --perigo:#DC2626; --perigo-bg:rgba(220,38,38,.1);
    --alerta:#B45309; --alerta-bg:rgba(180,83,9,.1);
    --brilho:0 0 20px rgba(13,148,136,.15);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--font);line-height:1.45;
       padding:14px 18px calc(48px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;
       -webkit-font-smoothing:antialiased}
  #app{max-width:460px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;color:inherit}
  button:disabled{opacity:.5}
  *:focus-visible{outline:2px solid var(--volta);outline-offset:2px}
  .tab{font-variant-numeric:tabular-nums}

  /* topo */
  .topo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .icone-app{width:38px;height:38px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .topo-titulo{flex:1;min-width:0}
  .topo-titulo b{display:block;font-size:1rem;font-weight:700;line-height:1.2}
  .topo-titulo span{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn-tema{background:var(--surf2);border:1px solid var(--borda);border-radius:999px;padding:6px 11px;
            font-size:.74rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .btn-tema svg{width:14px;height:14px}

  /* avisos */
  .toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
         width:calc(100% - 36px);max-width:440px;background:var(--surf2);border:1px solid var(--volta);
         border-radius:var(--r-md);padding:11px 16px;font-size:.86rem;font-weight:600;display:flex;gap:10px;
         align-items:flex-start;box-shadow:0 10px 25px rgba(0,0,0,.3);z-index:90;animation:desce .28s cubic-bezier(.18,.89,.32,1.28)}
  .toast .ok{color:var(--volta);flex-shrink:0}
  @keyframes desce{from{transform:translate(-50%,-70px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .faixa{border-radius:var(--r-md);padding:11px 14px;font-size:.84rem;line-height:1.45;margin-bottom:14px;border:1px solid}
  .faixa.erro{background:var(--perigo-bg);border-color:var(--perigo);color:var(--texto)}
  .faixa.erro .link{color:var(--perigo)}
  .offline{background:var(--alerta-bg);border:1px solid var(--alerta);color:var(--alerta);border-radius:var(--r-md);
           padding:10px 14px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:14px;
           position:relative;overflow:hidden}
  .offline::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
                  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:brilho 2.2s infinite}
  @keyframes brilho{to{left:100%}}
  .carregando{text-align:center;color:var(--muted);padding:60px 0;font-size:.9rem}
  .roda{width:28px;height:28px;border-radius:50%;border:3px solid var(--borda-forte);border-top-color:var(--volta);
        margin:0 auto 14px;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}

  /* blocos genéricos */
  .card{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-lg);padding:16px}
  .titulo-sec{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
              margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .titulo-sec small{font-size:.74rem;font-weight:400;text-transform:none;letter-spacing:0}
  .link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:0}
  .link-forte{background:none;border:none;color:var(--volta);font-size:.78rem;font-weight:700;padding:4px}
  .btn-icone{background:transparent;border:none;color:var(--muted);padding:6px;display:inline-flex;align-items:center;border-radius:8px}
  .btn-icone:hover{color:var(--texto);background:var(--hover)}
  .btn-icone svg{width:18px;height:18px}
  .btn-sec{background:var(--surf2);border:1px solid var(--borda);color:var(--texto);padding:10px 12px;border-radius:var(--r-md);
           font-size:.8rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
           transition:border-color var(--rapido),background var(--rapido)}
  .btn-sec:hover{border-color:var(--volta);background:var(--hover)}
  .btn-sec svg{width:16px;height:16px}
  .btn-principal{width:100%;padding:14px;background:var(--volta);color:var(--contra);border:none;border-radius:var(--r-md);
                 font-size:.95rem;font-weight:800;box-shadow:0 4px 14px rgba(45,212,191,.3);display:flex;
                 align-items:center;justify-content:center;gap:8px}
  .btn-principal:active,.btn-sec:active{transform:scale(.98)}
  .btn-perigo{width:100%;background:transparent;border:1px solid var(--perigo);color:var(--perigo);padding:10px;
              border-radius:var(--r-md);font-size:.82rem;font-weight:700}
  .btn-teste{background:transparent;border:1px dashed var(--borda-forte);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:.76rem}
  .btn-teste:hover{border-color:var(--volta);color:var(--volta)}
  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  pre{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:12px;font-family:var(--mono);
      font-size:.72rem;overflow-x:auto;color:var(--muted);max-height:170px;margin:12px 0 0;text-align:left}
  .rodape{margin-top:32px;font-size:.74rem;color:var(--subtle);text-align:center}

  /* formulários */
  .grupo{margin-bottom:14px;text-align:left}
  .rot{display:block;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .campo{width:100%;background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:12px 14px;
         color:var(--texto);font-size:.95rem;font-family:inherit;outline:none}
  .campo:focus{border-color:var(--volta);box-shadow:0 0 0 2px var(--volta-bg)}
  .campo.mono{font-family:var(--mono);font-size:.82rem}

  /* entrada */
  .login-hero{text-align:center;padding:26px 10px 20px}
  .login-icone{width:84px;height:84px;margin:0 auto 16px;border-radius:24px;box-shadow:var(--brilho);overflow:hidden}
  .login-hero h2{font-size:1.45rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
  .login-hero p{color:var(--muted);font-size:.88rem;margin:0}
  .login-cartoes{display:flex;flex-direction:column;gap:14px;margin:20px 0}
  .login-cartao{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-lg);padding:18px;display:flex;
                align-items:flex-start;gap:16px;text-align:left;transition:transform var(--rapido),border-color var(--rapido),background var(--rapido)}
  .login-cartao:hover{border-color:var(--volta);background:var(--hover);transform:translateY(-2px)}
  .login-cartao:active{transform:scale(.98)}
  .bolha{width:46px;height:46px;border-radius:14px;background:var(--surf);border:1px solid var(--borda);display:flex;
         align-items:center;justify-content:center;flex-shrink:0;color:var(--volta)}
  .gestor .bolha{color:var(--ida)}
  .login-cartao h3{font-size:1rem;font-weight:700;margin:0 0 4px;display:flex;justify-content:space-between}
  .login-cartao p{font-size:.8rem;color:var(--muted);margin:0;line-height:1.4}
  .login-rodape{margin-top:30px;text-align:center;font-size:.78rem;color:var(--subtle);display:flex;flex-direction:column;gap:10px;align-items:center}

  /* PIN */
  .pin{text-align:center;padding:10px 0 20px}
  .pin h2{font-size:1.35rem;font-weight:800;margin:0 0 6px}
  .pin > p{font-size:.85rem;color:var(--muted);margin:0}
  .casas{display:flex;justify-content:center;gap:16px;margin:24px auto;position:relative;width:max-content;cursor:text}
  /* campo real do PIN: invisível por cima das casas, chama o teclado numérico do aparelho */
  #pinCampo{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;caret-color:transparent}
  .casa{width:52px;height:58px;border-radius:var(--r-md);background:var(--surf2);border:2px solid var(--borda);display:flex;
        align-items:center;justify-content:center;font-size:1.6rem;font-weight:800}
  .casa.cheia{border-color:var(--volta);box-shadow:0 0 10px rgba(45,212,191,.25)}
  .casa.cursor{border-color:var(--ida)}
  .pin-aviso{background:var(--alerta-bg);border:1px solid var(--alerta);color:var(--alerta);font-size:.78rem;padding:8px 12px;
             border-radius:var(--r-sm);margin:0 auto 22px;max-width:320px;line-height:1.3}
  .pin .btn-principal{max-width:290px;margin:8px auto 0}

  /* motorista */
  .hero{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:14px;
        position:relative;overflow:hidden;text-align:left;width:100%;display:block}
  button.hero:hover{border-color:var(--volta)}
  .hero-pill{font-size:.72rem;text-transform:uppercase;font-weight:700;letter-spacing:.08em;color:var(--volta);
             display:inline-flex;align-items:center;gap:6px}
  .hero-pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
  .hero.outro .hero-pill{color:var(--ida)}
  .hero-hora{font-size:2.7rem;font-weight:900;letter-spacing:-.04em;line-height:1;margin:6px 0}
  .hero-data{font-size:.85rem;color:var(--muted);margin:0}
  .hero-dica{position:absolute;top:14px;right:14px;font-size:.7rem;background:var(--surf);color:var(--subtle);padding:2px 8px;
             border-radius:999px;border:1px solid var(--borda)}
  .viagens2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .btn-viagem{height:96px;border-radius:var(--r-lg);background:var(--surf2);border:1px solid var(--borda);border-left:6px solid;
              padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
              transition:transform .12s ease,box-shadow var(--rapido)}
  .btn-viagem:active{transform:scale(.97)}
  .btn-viagem.ida{border-left-color:var(--ida)} .btn-viagem.ida:hover{box-shadow:0 0 18px var(--ida-bg)}
  .btn-viagem.volta{border-left-color:var(--volta)} .btn-viagem.volta:hover{box-shadow:0 0 18px var(--volta-bg)}
  .vg-topo{display:flex;align-items:center;justify-content:space-between}
  .vg-nome{font-size:1.05rem;font-weight:800;letter-spacing:.02em}
  .ida .vg-nome{color:var(--ida)} .volta .vg-nome{color:var(--volta)}
  .vg-rota{font-size:.72rem;color:var(--muted);line-height:1.2}
  .vg-valor{font-size:1.15rem;font-weight:800}
  .btn-extra{width:100%;border-radius:var(--r-md);background:transparent;border:1px dashed var(--extra);color:var(--extra);padding:12px 16px;
             display:flex;align-items:center;justify-content:space-between;font-size:.88rem;font-weight:700;margin-bottom:16px}
  .btn-extra:hover{background:var(--extra-bg)}
  .receber{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .rot-mini{font-size:.74rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
  .receber-valor{font-size:1.7rem;font-weight:900;color:var(--volta);line-height:1.1;margin-top:4px}
  .receber-nota{font-size:.78rem;color:var(--subtle);text-align:right}
  .nota{font-size:.76rem;color:var(--subtle);line-height:1.5;margin-top:14px}

  /* listas */
  .item{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;
        display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem;text-align:left;width:100%}
  button.item:hover{border-color:var(--borda-forte)}
  .item-esq{display:flex;align-items:center;gap:10px;min-width:0}
  .item-esq strong{display:block}
  .item-esq span.sub{display:block;color:var(--muted);font-size:.75rem;overflow-wrap:anywhere}
  .item-dir{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:8px}
  .item-dir small{display:block;font-size:.72rem;color:var(--muted)}
  .item.pago{opacity:.62}
  .tag{padding:4px 8px;border-radius:6px;font-size:.7rem;font-weight:800;letter-spacing:.04em;flex-shrink:0}
  .tag.ida{background:var(--ida-bg);color:var(--ida)} .tag.volta{background:var(--volta-bg);color:var(--volta)}
  .tag.extra{background:var(--extra-bg);color:var(--extra)} .tag.pix{background:var(--pix-bg);color:var(--pix)}
  .mini{background:transparent;border:1px solid var(--borda-forte);color:var(--muted);padding:3px 9px;border-radius:999px;font-size:.7rem}
  .mini:hover{border-color:var(--perigo);color:var(--perigo)}
  .navmes{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--borda);border-radius:999px;padding:2px}
  .navmes button{background:none;border:none;width:28px;height:26px;border-radius:999px;font-size:1rem;color:var(--muted)}
  .navmes button:hover{background:var(--hover);color:var(--texto)}
  .navmes span{font-size:.76rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--texto);padding:0 4px}

  /* gestor */
  .cab-gestor{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .cab-gestor h2{font-size:1.25rem;font-weight:800;margin:0}
  .btn-sair{background:transparent;border:1px solid var(--borda);color:var(--muted);padding:5px 11px;border-radius:999px;font-size:.74rem;font-weight:600}
  .btn-sair:hover{border-color:var(--perigo);color:var(--perigo)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
  .kpi{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:10px 8px;text-align:center}
  .kpi small{display:block;font-size:.64rem;text-transform:uppercase;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
  .kpi b{font-size:.98rem;font-weight:800}
  .pagar{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;margin-bottom:10px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--surf);border:1px solid var(--borda);color:var(--volta);display:flex;
          align-items:center;justify-content:center;font-size:.95rem;font-weight:800;flex-shrink:0}
  .pagar-info{flex:1;margin:0 12px;min-width:0}
  .pagar-info b{display:block;font-size:.88rem}
  .pagar-info span{font-size:.74rem;color:var(--muted)}
  .btn-pix{background:var(--pix-bg);border:1px solid var(--pix);color:var(--pix);padding:6px 12px;border-radius:999px;font-size:.78rem;
           font-weight:700;white-space:nowrap}
  .btn-pix:hover{background:var(--pix);color:var(--contra)}
  .vazio{font-size:.82rem;color:var(--subtle);margin:0 0 6px}
  .motorista-linha{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:10px 12px;display:flex;
                   align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.8rem}
  .motorista-linha strong{display:block}
  .pix-chave{font-family:var(--mono);font-size:.85rem;overflow-wrap:anywhere;color:var(--texto)}
  .chip{font-family:var(--mono);font-size:.72rem;background:var(--surf);padding:2px 6px;border-radius:4px;border:1px solid var(--borda);
        color:var(--volta);overflow-wrap:anywhere}
  .acoes-linha{display:flex;align-items:center;gap:2px;flex-shrink:0}

  /* folha que sobe de baixo */
  .fundo-folha{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:70}
  .folha{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:500px;background:var(--surf);border-top:1px solid var(--borda);
         border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -15px 40px rgba(0,0,0,.45);z-index:80;max-height:90vh;overflow-y:auto;
         padding:12px 20px calc(28px + env(safe-area-inset-bottom))}
  .folha.entra{animation:sobe .32s cubic-bezier(.16,1,.3,1)}
  .fundo-folha.entra{animation:aparece .25s ease}
  @keyframes sobe{from{transform:translateY(105%)}to{transform:translateY(0)}}
  @keyframes aparece{from{opacity:0}to{opacity:1}}
  .alca{width:44px;height:5px;border-radius:999px;background:var(--borda-forte);margin:4px auto 16px;display:block;border:none;padding:0}
  .folha h3{margin:0 0 6px;font-size:1.15rem}
  .folha > p{font-size:.8rem;color:var(--muted);margin:0 0 16px}
  .bloco{background:var(--surf2);border:1px solid var(--borda);border-radius:var(--r-md);padding:14px;margin-bottom:14px;text-align:left}
  .resumo{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
  .resumo b{font-size:.95rem;color:var(--texto)}
  .e2e{font-family:var(--mono);font-size:.76rem;background:var(--surf);padding:8px;border-radius:6px;border:1px solid var(--borda);
       word-break:break-all;margin-top:6px}
  .ajuda{font-size:.74rem;color:var(--subtle);margin:6px 0 0}
  .lembrete{background:var(--alerta-bg);border:1px solid var(--alerta);color:var(--alerta);padding:10px 12px;border-radius:var(--r-sm);
            font-size:.76rem;line-height:1.4;margin-bottom:16px}
  .recibo{text-align:center}

<body>
<div id="app"></div>
<input type="file" id="arquivo" accept="application/pdf,image/*" hidden>

<script>
/* ————— endereço /exec do aplicativo web do Apps Script ————— */
const API = "https://script.google.com/macros/s/AKfycbyb3mIEaspqZPGhbWofnaqfZ7YwMV9URH0usuFylEIY7AFe8BKq2jlzzfMqZDyrpM4M/exec";
/* ————————————————————————————————————————————————————————— */

const VERSAO = "6.1";

const TIPOS = {
  ida:   {sigla:"IDA",   rotulo:"Levar equipe",  sub:"casa → empresa", cor:"var(--ida)"},
  volta: {sigla:"VOLTA", rotulo:"Trazer equipe", sub:"empresa → casa", cor:"var(--volta)"},
  extra: {sigla:"EXTRA", rotulo:"Viagem avulsa", sub:"valor e descrição na mão", cor:"var(--extra)"}
};
const pad = n => String(n).padStart(2,"0");
const hojeISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const agoraHM = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const moeda = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// data vem da planilha (digitada pelo motorista): sempre escapar, vai direto para o innerHTML
const curto = iso => { const [a,m,d]=String(iso).split("-"); return esc(d&&m ? d+"/"+m : iso); };
// impede que texto vire fórmula ao colar no Excel
const celula = s => /^[=+\-@\t\r]/.test(String(s==null?"":s)) ? "'"+s : String(s==null?"":s);
function mover(mes,passo){
  const [a,m]=mes.split("-").map(Number);
  const d=new Date(a,m-1+passo,1);
  return d.getFullYear()+"-"+pad(d.getMonth()+1);
}
const soma = l => l.reduce((s,v)=>s+Number(v.valor||0),0);
// E2E do PIX: "E" + 31 letras ou números. Colado do app do banco às vezes vem com espaços.
const normalizarE2E = v => { const e = String(v||"").replace(/\s+/g,""); return /^E[0-9A-Za-z]{31}$/.test(e) ? e : ""; };
const linkComprovante = id => "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/view";
const tamanhoArquivo = b => !b ? "" : b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB";

/* O atalho na tela inicial abre sem o "?m=", porque o Chrome usa o start_url do
   manifesto. Por isso o código do motorista fica guardado no próprio aparelho. */
function tokenDoAparelho(){
  const naUrl = new URLSearchParams(location.search).get("m");
  if(naUrl){ try { localStorage.setItem("cf_motorista", naUrl); } catch(e){} return naUrl; }
  let guardado = null;
  try { guardado = localStorage.getItem("cf_motorista"); } catch(e){}
  // devolve o "?m=" ao endereço: assim um favorito ou atalho simples carrega o
  // código junto, e o acesso sobrevive a uma limpeza de dados do navegador
  if(guardado){
    try { history.replaceState(null, "", location.pathname + "?m=" + encodeURIComponent(guardado)); } catch(e){}
  }
  return guardado || null;
}

// ?sair=1 limpa o acesso de motorista deste aparelho (usado pelo gestor após testes)
if(new URLSearchParams(location.search).get("sair")){
  try { localStorage.removeItem("cf_motorista"); } catch(e){}
  location.replace(location.pathname);
}

// PIN do gestor vale 30 dias a partir de quando foi digitado (não renova com o uso).
// Sair ou vencer apaga o PIN e as cópias dos dados do gestor deste aparelho.
const PRAZO_PIN = 30 * 864e5;
function esquecerGestor(){
  try {
    Object.keys(localStorage)
      .filter(k => k === "cf_pin" || k === "cf_pin_ate" || k.indexOf("cf_cache_gestor_") === 0)
      .forEach(k => localStorage.removeItem(k));
  } catch(e){}
}
function guardarPin(p){
  try { localStorage.setItem("cf_pin", p); localStorage.setItem("cf_pin_ate", String(Date.now() + PRAZO_PIN)); } catch(e){}
}
(function vencerPin(){
  try {
    if(!localStorage.getItem("cf_pin")) return;
    const ate = Number(localStorage.getItem("cf_pin_ate"));
    if(!ate) localStorage.setItem("cf_pin_ate", String(Date.now() + PRAZO_PIN)); // PIN de antes da 5.1
    else if(Date.now() > ate) esquecerGestor();
  } catch(e){}
})();

const E = {
  token: tokenDoAparelho(),
  mes: hojeISO().slice(0,7),
  carregando: true,
  ocupado: false,
  aviso: null, avisoBom: false,
  podeRepetir: false,
  tentativa: 1, totalTentativas: 3,
  dados: null,
  carimbo: {data: hojeISO(), hora: agoraHM(), manual: false},
  extraAberto: false,
  extra: {valor: "", desc: ""},
  fechando: null,
  detalhe: null,
  folhaNova: false,
  cadastroAberto: false,
  pix: null,
  pinDigitado: "",
  pin: localStorage.getItem("cf_pin") || "",
  liberado: false,
  semPin: false,
  csv: null,
  diagnostico: null,
  esvaziando: false,
  papel: null
};

/* ————— comunicação: tudo por GET, com tempo limite e novas tentativas ————— */
const espera = ms => new Promise(r => setTimeout(r, ms));

async function chamar(params, tentativas, aoTentar, limite){
  tentativas = tentativas || 3;
  // ações com PIN vão por POST (o servidor recusa gestor por GET) e o PIN não fica na URL;
  // text/plain evita o preflight de CORS que o Apps Script não responde
  const porPost = "pin" in params;
  const u = new URL(API);
  if(!porPost){
    Object.keys(params).forEach(k => { if(params[k]!=null && params[k]!=="") u.searchParams.set(k, params[k]); });
    u.searchParams.set("_", Date.now());
  }
  let ultimo;
  for(let i = 0; i < tentativas; i++){
    if(aoTentar) aoTentar(i + 1, tentativas);
    const ctrl = new AbortController();
    const relogio = setTimeout(() => ctrl.abort(), limite || 15000);
    try{
      const r = porPost
        ? await fetch(API, {method:"POST", body:JSON.stringify(params), headers:{"Content-Type":"text/plain"}, redirect:"follow", cache:"no-store", signal:ctrl.signal})
        : await fetch(u.toString(), {method:"GET", redirect:"follow", cache:"no-store", signal:ctrl.signal});
      const texto = await r.text();
      try { return JSON.parse(texto); }
      catch(e){ throw new Error("resposta inesperada do servidor (HTTP "+r.status+")"); }
    } catch(e){
      ultimo = e.name === "AbortError" ? new Error("o servidor demorou demais para responder") : e;
      if(i < tentativas - 1) await espera(1200 * (i + 1));
    } finally { clearTimeout(relogio); }
  }
  throw ultimo;
}

const fila = () => { try { return JSON.parse(localStorage.getItem("cf_fila")||"[]"); } catch(e){ return []; } };
const setFila = f => localStorage.setItem("cf_fila", JSON.stringify(f));

/* Reenvia o que ficou guardado sem internet. Roda depois que a tela carregou.
   O que o servidor recusar sai da fila; insistir não mudaria a resposta. */
async function esvaziarFila(){
  const f = fila();
  if(!f.length) return false;
  const restantes = [], recusados = [];
  for(const p of f){
    try {
      const r = await chamar(p, 1);
      if(!r.ok) recusados.push(r.erro || "recusado");
    } catch(e){ restantes.push(p); }
  }
  setFila(restantes);
  if(recusados.length){
    E.aviso = recusados.length + (recusados.length === 1 ? " registro pendente foi recusado" : " registros pendentes foram recusados") +
              " pelo servidor: " + recusados[0];
    E.avisoBom = false;
  }
  return restantes.length < f.length;
}

/* ————— cache local ————— */
function chaveCache(){ return "cf_cache_" + (E.token || "gestor") + "_" + E.mes; }
function guardarCache(d){ try { localStorage.setItem(chaveCache(), JSON.stringify({em:Date.now(), d:d})); } catch(e){} }
function lerCache(){
  try{ const c = JSON.parse(localStorage.getItem(chaveCache()) || "null"); return c && c.d ? c : null; }
  catch(e){ return null; }
}

function mostrarTentativa(n, total){ E.tentativa = n; E.totalTentativas = total; if(E.carregando) pintar(); }

async function carregar(){
  E.carregando = true; E.podeRepetir = false; E.tentativa = 1; pintar();
  try{
    if(E.token){
      const r = await chamar({acao:"motorista", t:E.token, mes:E.mes}, 3, mostrarTentativa);
      if(r.ok){ E.dados = r; guardarCache(r); }
      else { E.aviso = r.erro; E.avisoBom = false; }
    } else if(E.liberado || E.pin){
      const r = await chamar({acao:"gestor", pin:E.pin, mes:E.mes}, 3, mostrarTentativa);
      if(r.semPin){ E.semPin = true; E.liberado = false; }
      else if(r.ok){
        E.dados = r; E.liberado = true; guardarCache(r);
        // só um PIN recém-digitado ganha prazo novo; abrir o app de novo não renova
        if(localStorage.getItem("cf_pin") !== E.pin) guardarPin(E.pin);
      }
      else { E.liberado = false; E.aviso = r.erro; E.avisoBom = false; }
    }
  } catch(err){
    const c = lerCache();
    if(c){ E.dados = c.d; if(!E.token) E.liberado = true; }
    // sem resposta não é o mesmo que link inválido: o motorista continua vendo os botões
    // e registra pela fila. A tela de "acesso não vale mais" fica só para recusa do servidor.
    else if(E.token) E.dados = {semConexao:true, viagens:[], pagamentos:[]};
    E.aviso = "A planilha não respondeu agora (" + err.message + "). " +
      (c ? "A lista abaixo é a última que chegou — pode estar desatualizada. " : "") +
      "Pode registrar normalmente: fica guardado no celular e sobe sozinho.";
    E.avisoBom = false;
    E.podeRepetir = true;
  }
  E.carregando = false; E.ocupado = false; pintar();

  if(fila().length && !E.esvaziando){
    E.esvaziando = true;
    esvaziarFila().then(enviou => { E.esvaziando = false; if(enviou) carregar(); else pintar(); });
  }
}

const MESES_LONGOS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEMANA_CURTA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const mesLongo = mes => { const [a,m] = mes.split("-"); return MESES_LONGOS[Number(m)-1]+"/"+a; };
function dataPorExtenso(iso){
  const [a,m,d] = String(iso).split("-").map(Number);
  return (a&&m&&d) ? new Date(a,m-1,d).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) : esc(iso);
}
function diaCurto(iso){
  const [a,m,d] = String(iso).split("-").map(Number);
  return (a&&m&&d) ? SEMANA_CURTA[new Date(a,m-1,d).getDay()]+" "+pad(d)+"/"+pad(m) : esc(iso);
}
const e2eCurto = e => e && e.length > 14 ? e.slice(0,9)+"…"+e.slice(-4) : (e||"");
const plural = (n, um, varios) => n+" "+(n===1?um:varios);
const navMes = () => '<span class="navmes"><button data-acao="mes" data-passo="-1" aria-label="mês anterior">‹</button>'+
  '<span>'+mesLongo(E.mes)+'</span><button data-acao="mes" data-passo="1" aria-label="próximo mês">›</button></span>';

/* tema: auto (segue o aparelho), escuro ou claro — escolha guardada só neste aparelho */
const TEMAS = {auto:{ic:"auto", nome:"Auto"}, escuro:{ic:"lua", nome:"Escuro"}, claro:{ic:"sol", nome:"Claro"}};
function aplicarTema(){
  let t = "auto"; try { t = localStorage.getItem("cf_tema") || "auto"; } catch(e){}
  if(!TEMAS[t]) t = "auto";
  if(t === "auto") document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema", t);
  return t;
}
let TEMA = aplicarTema();

let avisoTimer = null;
function pintar(){
  const app = document.getElementById("app");
  const sub = E.token ? (E.dados && E.dados.nome ? esc(E.dados.nome) : "Motorista")
            : E.liberado ? "Painel do gestor" : "Transporte da equipe";
  let html = '<div class="topo"><div class="icone-app">'+ICONE+'</div>'+
    '<div class="topo-titulo"><b>Viagens Couve Flor</b><span>'+sub+'</span></div>'+
    '<button class="btn-tema" data-acao="tema" aria-label="Trocar tema">'+IC[TEMAS[TEMA].ic]+TEMAS[TEMA].nome+'</button></div>';

  // aviso de sucesso aparece por cima e some sozinho; erro fica na tela até ser resolvido
  if(E.aviso && E.avisoBom) html += '<div class="toast" role="status"><span class="ok">✓</span><span>'+esc(E.aviso)+'</span></div>';
  else if(E.aviso) html += '<div class="faixa erro" role="alert">'+esc(E.aviso)+
    (E.podeRepetir?' <button class="link" data-acao="recarregar">tentar de novo</button>':'')+'</div>';
  const pendentes = fila().length;
  if(pendentes) html += '<div class="offline">'+IC.semRede+'<span>'+
    plural(pendentes, "viagem aguardando", "viagens aguardando")+' internet — '+(pendentes===1?"enviará sozinha":"enviarão sozinhas")+'</span></div>';

  if(E.carregando) html += '<div class="carregando"><div class="roda"></div>Conectando à planilha…' +
    (E.tentativa > 1 ? '<br>tentativa ' + E.tentativa + ' de ' + E.totalTentativas : '') + '</div>';
  else if(E.token) html += E.dados ? telaMotorista() : telaSemAcesso();
  else if(E.liberado) html += telaGestor();
  else if(!E.pin && !E.semPin && E.papel !== "gestor") html += telaEscolha();
  else html += telaPin();

  if(!E.carregando) html += folha();
  if(!E.carregando && (E.token || E.liberado)) html += '<p class="rodape">Viagens Couve Flor · versão '+VERSAO+'</p>';
  app.innerHTML = html;
  E.folhaNova = false;
  // na tela do PIN o cursor já fica nas casas (no computador digita direto; no celular, um toque abre o teclado)
  const campoPin = document.getElementById("pinCampo");
  if(campoPin) campoPin.focus();

  clearTimeout(avisoTimer);
  if(E.aviso && E.avisoBom && !E.ocupado){
    const atual = E.aviso;
    avisoTimer = setTimeout(() => { if(E.aviso === atual){ E.aviso = null; pintar(); } }, 4500);
  }
}

function telaMotorista(){
  const c = E.carimbo, eAgora = !c.mexido;
  let h;
  if(c.manual){
    h = '<div class="hero outro"><span class="hero-pill"><i></i>Outro dia ou horário</span>'+
        '<div class="grade2" style="margin-top:10px">'+
        '<input type="date" id="cData" class="campo" value="'+c.data+'" aria-label="dia">'+
        '<input type="time" id="cHora" class="campo" value="'+c.hora+'" aria-label="horário"></div>'+
        '<div style="display:flex;gap:10px;margin-top:10px">'+
        '<button class="btn-sec" style="flex:1" data-acao="fecharCarimbo">Pronto</button>'+
        '<button class="btn-sec" style="flex:1" data-acao="carimboAgora">Usar agora</button></div></div>';
  } else {
    h = '<button class="hero'+(eAgora?'':' outro')+'" data-acao="abrirCarimbo">'+
        '<span class="hero-dica">alterar ⟳</span>'+
        '<span class="hero-pill"><i></i>'+(eAgora?"Horário atual":"Registrando em outro horário")+'</span>'+
        '<div class="hero-hora tab">'+esc(c.hora)+'</div>'+
        '<p class="hero-data">'+dataPorExtenso(c.data)+'</p></button>';
  }
  const offline = !!E.dados.semConexao;
  const tarifa = offline ? "" : moeda(E.dados.tarifa||0);

  h += '<div class="viagens2">';
  for(const t of ["ida","volta"]){
    h += '<button class="btn-viagem '+t+'" '+(E.ocupado?"disabled":"")+' data-acao="tocar" data-tipo="'+t+'">'+
      '<div class="vg-topo"><span class="vg-nome">'+TIPOS[t].sigla+'</span>'+IC[t]+'</div>'+
      '<div><div class="vg-rota">'+TIPOS[t].sub+'</div><div class="vg-valor tab">'+tarifa+'</div></div></button>';
  }
  h += '</div><button class="btn-extra" '+(E.ocupado?"disabled":"")+' data-acao="tocar" data-tipo="extra">'+
    '<span>+ Registrar viagem EXTRA</span><span style="font-size:.75rem;font-weight:400">valor e motivo livres →</span></button>';

  // sem dados do servidor, não há o que resumir: mostrar zero seria informação errada
  if(offline) return h + '<p class="nota">Seu saldo e a lista de viagens aparecem quando a conexão voltar.</p>';

  h += '<div class="card"><div class="receber"><div><div class="rot-mini">A receber</div>'+
    '<div class="receber-valor tab">'+moeda(E.dados.abertoValor||0)+'</div></div>'+
    '<div class="receber-nota"><strong>'+plural(E.dados.abertoQtd||0, "viagem", "viagens")+'</strong>'+
    (E.dados.abertoDesde?'<br>desde '+curto(E.dados.abertoDesde):'<br>em aberto')+'</div></div></div>';

  // o motorista vê a própria chave para conferir se o gestor cadastrou certo
  h += '<div class="card" style="margin-top:12px"><div class="rot-mini">Sua chave PIX</div>'+
    (E.dados.chave
      ? '<div class="pix-chave" style="margin-top:4px">'+esc(E.dados.chave)+'</div>'+
        (E.dados.banco ? '<p class="ajuda">'+esc(E.dados.banco)+'</p>' : '')+
        '<p class="ajuda">Confira. Se estiver errada, avise o gestor antes do próximo pagamento.</p>'
      : '<p class="ajuda">Ainda não cadastrada. Mande sua chave PIX para o gestor.</p>')+'</div>';

  const pgs = (E.dados.pagamentos||[]).slice().sort((a,b)=>String(b.ate).localeCompare(String(a.ate)));
  if(pgs.length){
    h += '<div class="titulo-sec"><span>Pagamentos recebidos</span></div>';
    for(const p of pgs.slice(0,6)) h += itemPagamento(p, false);
  }

  const vs = (E.dados.viagens||[]).slice().sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
  h += '<div class="titulo-sec"><span>Viagens do mês</span>'+navMes()+'</div>'+
    '<p class="vazio">'+plural(vs.length, "viagem", "viagens")+' · '+moeda(soma(vs))+' no mês</p>';
  h += listar(vs, {cancelar:"cancelar"});
  h += '<p class="nota">Você cancela o que lançou hoje. Registro de outros dias, ou viagem já paga, só o gestor mexe.</p>';
  return h;
}

      '<span class="sub tab">'+(p.e2e ? esc(e2eCurto(p.e2e))+' ✓' : plural(p.qtd, "viagem", "viagens"))+'</span></div></div>'+

    '<button class="link-forte" data-acao="alternarCadastro">'+(E.cadastroAberto?"fechar":"+ Adicionar")+'</button></div>';

      '<span class="ajuda" style="display:block;margin-top:4px;overflow-wrap:anywhere">'+
        (m.chave ? 'PIX '+esc(m.chave)+(m.banco ? ' · '+esc(m.banco) : '') : '<span style="color:var(--ida)">sem chave PIX</span>')+'</span></div>'+

        '<button class="btn-icone" data-acao="whats" data-id="'+esc(m.id)+'" data-nome="'+esc(m.nome)+'" title="Enviar link pelo WhatsApp" aria-label="Enviar link pelo WhatsApp">'+IC.zap+'</button>'+

function listar(vs, op){
  if(!vs.length) return '<p class="vazio">Nenhuma viagem neste mês.</p>';
  let h = "";
  for(const v of vs){
    const tipo = TIPOS[v.tipo] ? v.tipo : "extra";
    const pago = !!v.pagamento;
    const meio = [op.nome ? v.nome : "", v.descricao].filter(Boolean).join(" · ");
    // viagem paga não se cancela; motorista só cancela o que lançou hoje
    const podeCancelar = !pago && (op.cancelar === "cancelarG" ||
      (E.dados && E.dados.hoje && String(v.enviado).indexOf(E.dados.hoje) === 0));
    h += '<div class="item'+(pago?' pago':'')+'">'+
      '<div class="item-esq"><span class="tag '+tipo+'">'+TIPOS[tipo].sigla+'</span><div style="min-width:0">'+
        '<strong>'+diaCurto(v.data)+' <span class="tab" style="font-weight:400;color:var(--muted)">'+esc(v.hora)+'</span></strong>'+
        (meio?'<span class="sub">'+esc(meio)+'</span>':'')+'</div></div>'+
      '<div class="item-dir"><div><b class="tab">'+moeda(v.valor)+'</b>'+(pago?'<small style="color:var(--pix)">pago</small>':'')+'</div>'+
        (podeCancelar ? '<button class="mini" data-acao="'+op.cancelar+'" data-id="'+esc(v.id)+'">cancelar</button>' : '')+
      '</div></div>';
  }
  return h;
}

/* folha que sobe de baixo: EXTRA, fechamento PIX ou detalhe de um pagamento */

  let corpo = "";
  if(E.token && E.extraAberto) corpo = folhaExtra();

  if(!corpo) return "";
  const entra = E.folhaNova ? " entra" : "";
  return '<div class="fundo-folha'+entra+'" data-acao="fecharFolha"></div>'+
    '<div class="folha'+entra+'" role="dialog" aria-modal="true">'+
    '<button class="alca" data-acao="fecharFolha" aria-label="Fechar"></button>'+corpo+'</div>';
}

function folhaPagamento(){
  const p = (E.dados && E.dados.pagamentos || []).find(x => String(x.id) === String(E.detalhe));
  if(!p) return "";
  const gestor = !E.token;
  let h = '<div class="recibo"><div class="recibo-icone'+(gestor && p.comprovante?' doc':'')+'">'+(gestor && p.comprovante ? IC.doc : IC.check)+'</div>'+
    '<h3>Pagamento PIX</h3><p style="font-size:.8rem;color:var(--muted);margin:0">'+curto(p.de)+' a '+curto(p.ate)+'</p></div>'+
    '<div class="linhas">'+
      (gestor?'<div><span>Motorista</span><b>'+esc(p.nome)+'</b></div>':'')+
      '<div><span>Valor pago</span><b class="tab" style="color:var(--pix)">'+moeda(p.valor)+'</b></div>'+
      '<div><span>Viagens</span><b class="tab">'+esc(p.qtd)+'</b></div>'+
      '<div><span>Pago em</span><b class="tab">'+esc(p.pagoEm)+'</b></div>'+
    '</div>';
  if(p.e2e) h += '<label class="rot">ID da transação (E2E)</label><div class="e2e">'+esc(p.e2e)+'</div>'+
    '<button class="btn-sec" style="width:100%;margin-top:8px" data-acao="copiarE2E" data-e2e="'+esc(p.e2e)+'">Copiar código E2E</button>';
  else h += '<p class="ajuda">Pagamento fechado antes da versão 5, sem código E2E.</p>';
  // o motorista vê o E2E, nunca o arquivo do comprovante

/* ————— comprovante ————— */
const LIMITE_PDF = 5 * 1024 * 1024;

const lerBase64 = blob => new Promise((ok, falhou) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => falhou(new Error("não deu para ler o arquivo"));
  r.readAsDataURL(blob);
});

/* Foto de celular tem 2–4 MB: vira JPEG de até 1600 px (~300 KB) antes de sair do aparelho.
   Print de tela em PNG também passa por aqui. */
async function reduzirImagem(arquivo){
  let img;
  try { img = await createImageBitmap(arquivo); }
  catch(e){ throw new Error("este formato de imagem não abre no navegador; envie JPG, PNG ou PDF"); }
  const escala = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); // PNG transparente não vira fundo preto
  g.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok, falhou) => c.toBlob(b => b ? ok(b) : falhou(new Error("não deu para converter a imagem")), "image/jpeg", 0.82));
}

/** Envia o comprovante de um pagamento já fechado. Devolve null se deu certo, ou o motivo da falha. */
async function anexar(idPagamento, arquivo){
  try{
    let blob = arquivo, tipo = arquivo.type;
    if(tipo === "application/pdf"){
      if(arquivo.size > LIMITE_PDF) return "PDF maior que 5 MB";
    } else if(/^image\//.test(tipo)){
      blob = await reduzirImagem(arquivo); tipo = "image/jpeg";
    } else return "o arquivo precisa ser PDF ou imagem";
    const dados = await lerBase64(blob);
    const r = await chamar({acao:"anexar_comprovante", pin:E.pin, id:idPagamento, tipo:tipo, dados:dados}, 2, null, 60000);
    return r.ok ? null : r.erro;
  } catch(e){ return e.message; }
}

/* ————— leitura do E2E no PDF do banco ————— */
/* O PDF do banco traz o texto dentro: dá para achar o E2E sem OCR e sem erro de O/0.
   Foto não passa por aqui (OCR seria pesado e erraria justamente no final do código).
   O texto fica só no aparelho; nada dele vai para o servidor. */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsCarregando = null;
function carregarPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsCarregando) pdfjsCarregando = new Promise((ok, falhou) => {
    const s = document.createElement("script");
    s.src = PDFJS + "pdf.min.js";
    s.integrity = "sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ==";
    s.crossOrigin = "anonymous";
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; ok(window.pdfjsLib); };
    s.onerror = () => { pdfjsCarregando = null; falhou(new Error("leitor de PDF não carregou")); };
    document.head.appendChild(s);
  });
  return pdfjsCarregando;
}

/** Texto do PDF sem espaços nem quebras: o banco às vezes quebra o código em duas linhas. */
async function textoDoPdf(arquivo){
  const lib = await carregarPdfjs();
  const doc = await lib.getDocument({data: await arquivo.arrayBuffer()}).promise;
  let t = "";
  for(let i = 1; i <= Math.min(doc.numPages, 3); i++){
    const c = await (await doc.getPage(i)).getTextContent();
    t += c.items.map(x => x.str).join("");
  }
  return t.replace(/\s+/g, "");
}

/** Data e hora de Brasília embutidas no E2E (posições 10–21, em UTC). null se não for data válida. */
function dataDoE2E(e2e){
  const m = /^E\d{8}(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(e2e || "");
  if(!m) return null;
  const [a, me, d, h, mi] = m.slice(1).map(Number);
  if(me < 1 || me > 12 || d < 1 || d > 31 || h > 23 || mi > 59) return null;
  const br = new Date(Date.UTC(a, me - 1, d, h, mi) - 3 * 3600 * 1000); // Brasil sem horário de verão desde 2019
  return {iso: br.toISOString().slice(0,10), hora: br.toISOString().slice(11,16)};
}

/** Códigos E2E distintos no texto, só os que têm data válida dentro. */
function e2esNoTexto(t){
  const achados = (t.match(/E\d{20}[0-9A-Za-z]{11}/g) || []).filter(dataDoE2E);
  return [...new Set(achados)];
}

/** O valor aparece no texto do comprovante? Compara no formato do banco: 1.748,97 */
function valorNoTexto(t, valor){
  const v = Number(valor).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  return new RegExp("(^|[^\\d.,])" + v.replace(/\./g, "\\.") + "(?!\\d)").test(t);
}

async function lerComprovante(arquivo){
  const f = E.fechando;
  f.leitura = "lendo";
  pintar();
  try{
    const t = await textoDoPdf(arquivo);
    if(E.fechando !== f) return; // fechamento cancelado enquanto lia
    f.texto = t;
    const achados = e2esNoTexto(t);
    if(achados.length === 1){
      const digitado = normalizarE2E(f.e2e);
      if(!digitado){ f.e2e = achados[0]; f.leitura = "preenchido"; }
      else f.leitura = digitado === achados[0] ? "confere" : "diferente:" + achados[0];
    } else f.leitura = achados.length ? "varios" : "nada";
  } catch(e){
    if(E.fechando === f) f.leitura = "falhou";
  }
  if(E.fechando === f) pintar();
}

/** Linhas de apoio abaixo do campo E2E: o que o PDF disse, a data do PIX e o valor. */
function apoioE2E(f, totalEntram){
  const linhas = [];
  const l = f.leitura || "";
  if(l === "lendo") linhas.push(["fraco", "Lendo o PDF…"]);
  else if(l === "preenchido") linhas.push(["bom", "Código lido do PDF. Confira com o comprovante."]);
  else if(l === "confere") linhas.push(["bom", "Confere com o código do PDF."]);
  else if(l.indexOf("diferente:") === 0) linhas.push(["ruim", "O PDF traz outro código: " + l.slice(10) + ". Confira qual é o certo."]);
  else if(l === "varios") linhas.push(["ruim", "O PDF tem mais de um código E2E. Cole o do pagamento ao motorista."]);
  else if(l === "nada") linhas.push(["fraco", "Não achei o código no PDF. Cole do app do banco."]);
  else if(l === "falhou") linhas.push(["fraco", "Não deu para ler o PDF. Cole o código do app do banco."]);

  const quando = dataDoE2E(normalizarE2E(f.e2e));
  if(quando) linhas.push(["fraco", "PIX feito em " + curto(quando.iso) + "/" + quando.iso.slice(0,4) + " às " + quando.hora + "."]);
  if(f.texto && totalEntram > 0){
    linhas.push(valorNoTexto(f.texto, totalEntram)
      ? ["bom", "O valor " + moeda(totalEntram) + " aparece no comprovante."]
      : ["ruim", "O valor " + moeda(totalEntram) + " não aparece no comprovante. É o comprovante certo?"]);
  }
  const cor = {bom:"var(--pix)", ruim:"var(--alerta)", fraco:"var(--subtle)"};
  const marca = {bom:"✓ ", ruim:"⚠ ", fraco:""};
  return linhas.map(([tom, txt]) =>
    '<p style="font-size:.78rem;font-weight:600;color:'+cor[tom]+';margin:8px 0 0;line-height:1.4;overflow-wrap:anywhere">'+marca[tom]+esc(txt)+'</p>').join("");
}

async function arquivoEscolhido(arquivo){
  const para = E.anexandoPara; E.anexandoPara = null;
  if(!arquivo || !para) return;
  if(para === "fechamento"){
    if(!E.fechando) return;
    E.fechando.arquivo = arquivo;
    E.fechando.texto = null; E.fechando.leitura = null;
    if(arquivo.type === "application/pdf") return lerComprovante(arquivo);
    return pintar();
  }
  E.ocupado = true; E.aviso = "Enviando comprovante…"; E.avisoBom = true; pintar();
  const falha = await anexar(para, arquivo);
  E.aviso = falha ? "O comprovante não subiu: " + falha : "Comprovante guardado.";
  E.avisoBom = !falha;
  await carregar();
}

async function registrar(tipo, valor, descricao){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const p = {acao:"registrar", t:E.token, id:id, tipo:tipo,
             data:E.carimbo.data, hora:E.carimbo.hora, valor:valor, descricao:descricao};
  E.ocupado = true; E.aviso = "Enviando…"; E.avisoBom = true; pintar();
  try{
    const r = await chamar(p);
    if(r.ok){
      E.extraAberto = false; E.extra = {valor:"", desc:""};
      E.carimbo = {data: hojeISO(), hora: agoraHM(), manual:false};
      E.aviso = TIPOS[tipo].rotulo + " registrada às " + p.hora + "."; E.avisoBom = true;
      await carregar();
    } else {
      E.aviso = "Não registrou: " + r.erro; E.avisoBom = false; E.ocupado = false; pintar();
    }
  } catch(err){
    const f = fila(); f.push(p); setFila(f);
    E.extraAberto = false; E.extra = {valor:"", desc:""};
    E.carimbo = {data: hojeISO(), hora: agoraHM(), manual:false};
    E.aviso = "Sem internet agora. A viagem ficou guardada no celular e sobe sozinha quando a conexão voltar.";
    E.avisoBom = true; E.ocupado = false; pintar();
  }
}

async function remover(params){
  E.ocupado = true; E.aviso = "Cancelando…"; E.avisoBom = true; pintar();
  try{
    const r = await chamar(params, 2);
    if(r.ok){ E.aviso = "Viagem cancelada."; E.avisoBom = true; await carregar(); }
    else { E.aviso = r.erro; E.avisoBom = false; E.ocupado = false; pintar(); }
  } catch(e){
    E.aviso = "Não deu para cancelar agora: " + e.message; E.avisoBom = false; E.ocupado = false; pintar();
  }
}

document.getElementById("app").addEventListener("click", ev => {
  const b = ev.target.closest("[data-acao]");
  if(b && ACOES[b.dataset.acao]) ACOES[b.dataset.acao](b);
});
document.getElementById("app").addEventListener("change", ev => {
  if(ev.target.id === "fAte" && E.fechando){ E.fechando.ate = ev.target.value; pintar(); }
  // dia e horário escolhidos na folha da EXTRA valem para o registro
  if((ev.target.id === "xData" || ev.target.id === "xHora") && ev.target.value){
    E.carimbo[ev.target.id === "xData" ? "data" : "hora"] = ev.target.value; E.carimbo.mexido = true;
  }
});
// a tela é redesenhada inteira a cada mudança: o que foi digitado precisa morar no estado
document.getElementById("app").addEventListener("input", ev => {
  if(ev.target.id === "fE2E" && E.fechando){
    E.fechando.e2e = ev.target.value;
    // código mudou à mão: o "confere/diferente" do PDF precisa ser refeito
    if(E.fechando.leitura && E.fechando.leitura !== "lendo" && E.fechando.leitura !== "falhou" && E.fechando.leitura !== "nada" && E.fechando.leitura !== "varios"){
      const doPdf = e2esNoTexto(E.fechando.texto || "")[0], digitado = normalizarE2E(E.fechando.e2e);
      E.fechando.leitura = !digitado ? null : (digitado === doPdf ? "confere" : "diferente:" + doPdf);
    }
    const apoio = document.getElementById("fApoio");
    if(apoio) apoio.innerHTML = apoioE2E(E.fechando, E.fechando.total);
  }
  if(ev.target.id === "eValor") E.extra.valor = ev.target.value;
  if(ev.target.id === "eDesc") E.extra.desc = ev.target.value;
  if(ev.target.id === "pChave" && E.pix) E.pix.chave = ev.target.value;
  if(ev.target.id === "pBanco" && E.pix) E.pix.banco = ev.target.value;
  if(ev.target.id === "pinCampo"){
    // redesenha só as casas, para o teclado do celular não fechar a cada dígito
    E.pinDigitado = ev.target.value = ev.target.value.replace(/\D/g, "").slice(0, 4);
    const n = E.pinDigitado.length;
    ev.target.parentNode.querySelectorAll(".casa").forEach((c, i) => {
      c.className = "casa" + (i < n ? " cheia" : "") + (i === n ? " cursor" : ""); c.textContent = i < n ? "•" : "";
    });
    const botao = document.querySelector('[data-acao="criarPin"]');
    if(botao) botao.disabled = n < 4;
    if(n === 4 && !E.semPin){ ev.target.blur(); ACOES.entrar(); }
  }
});
// fica fora do #app para não ser apagado quando a tela é redesenhada
document.getElementById("arquivo").addEventListener("change", ev => arquivoEscolhido(ev.target.files[0]));
window.addEventListener("online", () => esvaziarFila().then(m => { if(m) carregar(); }));
setInterval(() => { if(!E.carimbo.manual && !E.carimbo.mexido && !E.ocupado){ E.carimbo.data = hojeISO(); E.carimbo.hora = agoraHM(); } }, 20000);

carregar();
</script>
