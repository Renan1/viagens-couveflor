<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viagens · Couve Flor</title>
<meta name="theme-color" content="#0C1F2B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#0C1F2B; --caixa:#16303F; --borda:#2E4E60; --linha:#1C3646;
    --texto:#EAF2F6; --fraco:#8FA6C0; --apagado:#5C7A8C;
    --ida:#FFB020; --volta:#4ED8B0; --extra:#8FA6C0;
    --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);
       font-family:Inter,system-ui,-apple-system,sans-serif;
       padding:20px 16px calc(48px + env(safe-area-inset-bottom));
       -webkit-text-size-adjust:100%}
  #app{max-width:460px;margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  button:disabled{opacity:.5}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ida);outline-offset:2px}
  .topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
  .marca{font-family:var(--cond);font-size:21px;letter-spacing:.07em;color:var(--fraco)}
  .caixa{width:100%;background:var(--caixa);border:1px solid var(--borda);border-radius:4px;
         color:var(--texto);padding:18px 16px;text-align:left;display:block}
  .acao{background:var(--caixa);border:1px solid var(--borda);color:var(--texto);
        border-radius:3px;padding:9px 14px;font-size:14px}
  .mini{padding:3px 9px;font-size:12px;color:var(--fraco)}
  .link{background:none;border:none;color:var(--fraco);text-decoration:underline;font-size:13px;padding:0}
  .campo{background:var(--caixa);border:1px solid var(--borda);color:var(--texto);
         border-radius:3px;padding:9px 10px;font-size:15px;font-family:inherit;max-width:100%}
  .seta{background:var(--caixa);border:1px solid var(--borda);color:var(--texto);
        border-radius:3px;width:34px;height:34px;font-size:20px;line-height:1}
  .botao-viagem{display:flex;align-items:center;gap:16px;padding:22px 20px;margin-bottom:12px}
  .sigla{font-family:var(--cond);font-size:33px;min-width:82px;letter-spacing:.04em}
  .rotulo{display:block;font-size:19px;font-weight:600}
  .sub{display:block;font-size:13px;color:#7F9AAC;margin-top:2px}
  .viagem{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--linha)}
  .hora{font-family:var(--cond);font-size:25px;min-width:56px;font-variant-numeric:tabular-nums}
  .tipo{font-family:var(--cond);font-size:19px;min-width:58px;letter-spacing:.05em}
  .meio{flex:1;font-size:13px;color:var(--fraco);overflow-wrap:anywhere}
  .valor{font-size:13px;color:#7F9AAC;font-variant-numeric:tabular-nums}
  .dia{font-family:var(--cond);font-size:19px;color:#7F9AAC;margin:0 0 2px}
  .total{font-family:var(--cond);font-size:60px;line-height:1;margin:0 0 2px;color:var(--ida);
         font-variant-numeric:tabular-nums}
  .aviso{border-radius:4px;padding:12px;margin-bottom:16px;font-size:14px;line-height:1.5}
  .erro{background:#3B2116;border:1px solid #7A4326}
  .bom{background:#123A33;border:1px solid #2B6558}
  .navmes{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .navmes span{font-family:var(--cond);font-size:23px;letter-spacing:.05em}
  pre{background:var(--caixa);border:1px solid var(--borda);border-radius:4px;padding:12px;
      font-size:12px;overflow-x:auto;color:#B9CDD8;max-height:170px;margin:0 0 20px}
  .selo{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;font-size:11px;
        background:#123A33;border:1px solid #2B6558;color:var(--volta)}
  .rodape{margin-top:32px;font-size:11px;color:var(--apagado);text-align:center}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ————— endereço /exec do aplicativo web do Apps Script ————— */
const API = "https://script.google.com/macros/s/AKfycbyb3mIEaspqZPGhbWofnaqfZ7YwMV9URH0usuFylEIY7AFe8BKq2jlzzfMqZDyrpM4M/exec";
/* ————————————————————————————————————————————————————————— */

const VERSAO = "4.0";

const TIPOS = {
  ida:   {sigla:"IDA",   rotulo:"Levar equipe",  sub:"casa → empresa", cor:"var(--ida)"},
  volta: {sigla:"VOLTA", rotulo:"Trazer equipe", sub:"empresa → casa", cor:"var(--volta)"},
  extra: {sigla:"EXTRA", rotulo:"Viagem avulsa", sub:"valor e descrição na mão", cor:"var(--extra)"}
};
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const SEMANA = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const pad = n => String(n).padStart(2,"0");
const hojeISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const agoraHM = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const moeda = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const curto = iso => { const [a,m,d]=String(iso).split("-"); return d&&m ? d+"/"+m : iso; };
function rotuloDia(iso){
  const [a,m,d] = String(iso).split("-").map(Number);
  if(!a||!m||!d) return iso;
  return d+" de "+MESES[m-1]+", "+SEMANA[new Date(a,m-1,d).getDay()];
}
function rotuloMes(mes){ const [a,m]=mes.split("-"); return MESES[Number(m)-1]+" "+a; }
function mover(mes,passo){
  const [a,m]=mes.split("-").map(Number);
  const d=new Date(a,m-1+passo,1);
  return d.getFullYear()+"-"+pad(d.getMonth()+1);
}
const soma = l => l.reduce((s,v)=>s+Number(v.valor||0),0);

/* O atalho na tela inicial abre sem o "?m=", porque o Chrome usa o start_url do
   manifesto. Por isso o código do motorista fica guardado no próprio aparelho. */
function tokenDoAparelho(){
  const naUrl = new URLSearchParams(location.search).get("m");
  if(naUrl){ try { localStorage.setItem("cf_motorista", naUrl); } catch(e){} return naUrl; }
  try { return localStorage.getItem("cf_motorista") || null; } catch(e){ return null; }
}

const E = {
  token: tokenDoAparelho(),
  mes: hojeISO().slice(0,7),
  carregando: true,
  ocupado: false,
  aviso: null, avisoBom: false,
  podeRepetir: false,
  tentativa: 1, totalTentativas: 3,
  dados: null,
  carimbo: {data: hojeISO(), hora: agoraHM(), manual: false},
  extraAberto: false,
  fechando: null,
  pin: localStorage.getItem("cf_pin") || "",
  liberado: false,
  semPin: false,
  csv: null,
  diagnostico: null,
  esvaziando: false
};

/* ————— comunicação: tudo por GET, com tempo limite e novas tentativas ————— */
const espera = ms => new Promise(r => setTimeout(r, ms));

async function chamar(params, tentativas, aoTentar){
  tentativas = tentativas || 3;
  const u = new URL(API);
  Object.keys(params).forEach(k => { if(params[k]!=null && params[k]!=="") u.searchParams.set(k, params[k]); });
  u.searchParams.set("_", Date.now());
  let ultimo;
  for(let i = 0; i < tentativas; i++){
    if(aoTentar) aoTentar(i + 1, tentativas);
    const ctrl = new AbortController();
    const relogio = setTimeout(() => ctrl.abort(), 15000);
    try{
      const r = await fetch(u.toString(), {method:"GET", redirect:"follow", cache:"no-store", signal:ctrl.signal});
      const texto = await r.text();
      try { return JSON.parse(texto); }
      catch(e){ throw new Error("resposta inesperada do servidor (HTTP "+r.status+")"); }
    } catch(e){
      ultimo = e.name === "AbortError" ? new Error("o servidor demorou demais para responder") : e;
      if(i < tentativas - 1) await espera(1200 * (i + 1));
    } finally { clearTimeout(relogio); }
  }
  throw ultimo;
}

const fila = () => { try { return JSON.parse(localStorage.getItem("cf_fila")||"[]"); } catch(e){ return []; } };
const setFila = f => localStorage.setItem("cf_fila", JSON.stringify(f));

/* Reenvia o que ficou guardado sem internet. Roda depois que a tela carregou.
   O que o servidor recusar sai da fila; insistir não mudaria a resposta. */
async function esvaziarFila(){
  const f = fila();
  if(!f.length) return false;
  const restantes = [], recusados = [];
  for(const p of f){
    try {
      const r = await chamar(p, 1);
      if(!r.ok) recusados.push(r.erro || "recusado");
    } catch(e){ restantes.push(p); }
  }
  setFila(restantes);
  if(recusados.length){
    E.aviso = recusados.length + (recusados.length === 1 ? " registro pendente foi recusado" : " registros pendentes foram recusados") +
              " pelo servidor: " + recusados[0];
    E.avisoBom = false;
  }
  return restantes.length < f.length;
}

/* ————— cache local ————— */
function chaveCache(){ return "cf_cache_" + (E.token || "gestor") + "_" + E.mes; }
function guardarCache(d){ try { localStorage.setItem(chaveCache(), JSON.stringify({em:Date.now(), d:d})); } catch(e){} }
function lerCache(){
  try{ const c = JSON.parse(localStorage.getItem(chaveCache()) || "null"); return c && c.d ? c : null; }
  catch(e){ return null; }
}

function mostrarTentativa(n, total){ E.tentativa = n; E.totalTentativas = total; if(E.carregando) pintar(); }

async function carregar(){
  E.carregando = true; E.podeRepetir = false; E.tentativa = 1; pintar();
  try{
    if(E.token){
      const r = await chamar({acao:"motorista", t:E.token, mes:E.mes}, 3, mostrarTentativa);
      if(r.ok){ E.dados = r; guardarCache(r); }
      else { E.aviso = r.erro; E.avisoBom = false; }
    } else if(E.liberado || E.pin){
      const r = await chamar({acao:"gestor", pin:E.pin, mes:E.mes}, 3, mostrarTentativa);
      if(r.semPin){ E.semPin = true; E.liberado = false; }
      else if(r.ok){ E.dados = r; E.liberado = true; guardarCache(r); localStorage.setItem("cf_pin", E.pin); }
      else { E.liberado = false; E.aviso = r.erro; E.avisoBom = false; }
    }
  } catch(err){
    const c = lerCache();
    if(c && !E.dados){ E.dados = c.d; if(!E.token) E.liberado = true; }
    E.aviso = "A planilha não respondeu agora (" + err.message + "). " +
      (c ? "A lista abaixo é a última que chegou — pode estar desatualizada. " : "") +
      "Pode registrar normalmente: fica guardado no celular e sobe sozinho.";
    E.avisoBom = false;
    E.podeRepetir = true;
  }
  E.carregando = false; E.ocupado = false; pintar();

  if(fila().length && !E.esvaziando){
    E.esvaziando = true;
    esvaziarFila().then(enviou => { E.esvaziando = false; if(enviou) carregar(); else pintar(); });
  }
}

/* ————— telas ————— */
function pintar(){
  const app = document.getElementById("app");
  let html = '<div class="topo"><span class="marca">COUVE FLOR · TRANSPORTE</span>';
  if(E.token && E.dados) html += '<span style="font-size:15px">'+esc(E.dados.nome)+'</span>';
  html += '</div>';

  if(E.aviso) html += '<div class="aviso '+(E.avisoBom?"bom":"erro")+'">'+esc(E.aviso)+
    (E.podeRepetir?' <button class="link" style="color:var(--texto)" data-acao="recarregar">tentar de novo</button>':'')+'</div>';
  const pendentes = fila().length;
  if(pendentes) html += '<div class="aviso erro">'+pendentes+(pendentes===1?" registro aguardando":" registros aguardando")+' envio. Abra o app com internet para subir.</div>';

  if(E.carregando) html += '<p style="color:#7F9AAC">Conectando à planilha…' +
    (E.tentativa > 1 ? ' tentativa ' + E.tentativa + ' de ' + E.totalTentativas : '') + '</p>';
  else if(E.token) html += E.dados ? telaMotorista() : telaSemAcesso();
  else if(E.liberado) html += telaGestor();
  else html += telaPin();

  html += '<p class="rodape">versão '+VERSAO+'</p>';
  app.innerHTML = html;
}

function telaMotorista(){
  const c = E.carimbo, eHoje = c.data === hojeISO();
  let h = '<div class="caixa" style="margin-bottom:16px;padding:14px 16px">';
  if(c.manual){
    h += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
         '<input type="date" id="cData" class="campo" value="'+c.data+'">'+
         '<input type="time" id="cHora" class="campo" value="'+c.hora+'">'+
         '<button class="link" style="color:var(--volta)" data-acao="fecharCarimbo">pronto</button></div>';
  } else {
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'+
         '<span style="font-family:var(--cond);font-size:23px">'+(eHoje?"Agora":rotuloDia(c.data))+' · '+c.hora+'</span>'+
         '<button class="link" data-acao="abrirCarimbo">outro dia ou horário</button></div>';
  }
  h += '</div>';

  for(const t of ["ida","volta","extra"]){
    h += '<button class="caixa botao-viagem" '+(E.ocupado?"disabled":"")+
         ' style="border-left:6px solid '+TIPOS[t].cor+'" data-acao="tocar" data-tipo="'+t+'">'+
         '<span class="sigla" style="color:'+TIPOS[t].cor+'">'+TIPOS[t].sigla+'</span>'+
         '<span><span class="rotulo">'+TIPOS[t].rotulo+'</span><span class="sub">'+TIPOS[t].sub+'</span></span></button>';
    if(t==="extra" && E.extraAberto){
      h += '<div class="caixa" style="margin:-4px 0 12px">'+
           '<input id="eValor" class="campo" inputmode="decimal" placeholder="Valor, ex: 70" style="width:130px">'+
           '<input id="eDesc" class="campo" placeholder="O que foi essa viagem?" style="width:100%;margin-top:8px">'+
           '<div style="margin-top:10px;display:flex;gap:8px">'+
           '<button class="acao" data-acao="salvarExtra">Registrar extra</button>'+
           '<button class="link" data-acao="cancelarExtra">fechar</button></div></div>';
    }
  }

  // resumo do que ainda não foi pago
  h += '<div class="caixa" style="margin-top:24px;border-left:6px solid var(--ida)">'+
       '<span style="font-size:13px;color:var(--fraco)">A receber</span>'+
       '<div style="font-family:var(--cond);font-size:40px;line-height:1.1;color:var(--ida)">'+moeda(E.dados.abertoValor||0)+'</div>'+
       '<span style="font-size:13px;color:var(--fraco)">'+(E.dados.abertoQtd||0)+
         ((E.dados.abertoQtd===1)?" viagem em aberto":" viagens em aberto")+
         (E.dados.abertoDesde?" · desde "+curto(E.dados.abertoDesde):"")+'</span></div>';

  const pgs = (E.dados.pagamentos||[]).slice().sort((a,b)=>String(b.ate).localeCompare(String(a.ate)));
  if(pgs.length){
    h += '<p class="dia" style="margin-top:22px">Pagamentos recebidos</p>';
    for(const p of pgs.slice(0,6)){
      h += '<div class="viagem"><span style="flex:1;font-size:14px">'+curto(p.de)+' a '+curto(p.ate)+
           ' · '+p.qtd+(p.qtd===1?" viagem":" viagens")+'</span>'+
           '<span class="valor" style="color:var(--volta)">'+moeda(p.valor)+'</span></div>';
    }
  }

  const vs = (E.dados.viagens||[]).slice().sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
  h += '<div class="navmes" style="margin-top:28px">'+
       '<button class="seta" data-acao="mes" data-passo="-1">‹</button>'+
       '<span>'+rotuloMes(E.mes)+' · '+vs.length+(vs.length===1?" viagem":" viagens")+'</span>'+
       '<button class="seta" data-acao="mes" data-passo="1">›</button></div>'+
       '<p style="font-size:15px;color:var(--fraco);margin:0 0 16px">'+moeda(soma(vs))+' no mês</p>';

  h += listar(vs, {cancelar:"cancelar"});
  h += '<p style="font-size:12px;color:var(--apagado);margin-top:16px;line-height:1.5">'+
       'Você cancela o que lançou hoje. Registro de outros dias, ou viagem já paga, só o gestor mexe.</p>'+
       '<p style="margin-top:20px"><button class="link" data-acao="sair">não sou '+esc(E.dados.nome)+'</button></p>';
  return h;
}

function telaSemAcesso(){
  return '<p style="font-size:15px;color:var(--fraco);line-height:1.6">'+
    'Este aparelho está com um acesso de motorista que não vale mais. Abra de novo o link que o gestor mandou, '+
    'ou saia para entrar como gestor.</p>'+
    '<p style="margin-top:16px"><button class="acao" data-acao="sair">Sair deste acesso</button></p>';
}

function telaPin(){
  const primeira = E.semPin;
  return '<div style="max-width:300px">'+
    '<p style="font-family:var(--cond);font-size:26px;margin:0 0 4px">'+(primeira?"Crie o PIN do gestor":"PIN do gestor")+'</p>'+
    '<p style="font-size:13px;color:var(--fraco);margin:0 0 14px">'+
      (primeira?"Quatro dígitos. Só você usa esta tela.":"Quatro dígitos. Os motoristas entram pelo link pessoal.")+'</p>'+
    '<input id="pin" class="campo" type="password" inputmode="numeric" maxlength="4" '+
      'style="font-size:24px;letter-spacing:.4em;width:120px;text-align:center">'+
    '<button class="acao" style="margin-left:10px;padding:12px 18px" data-acao="'+(primeira?"criarPin":"entrar")+'">'+
      (primeira?"Criar":"Entrar")+'</button>'+
    '<p style="margin-top:22px"><button class="link" data-acao="testar">testar conexão com a planilha</button></p>'+
    (E.diagnostico?'<pre>'+esc(E.diagnostico)+'</pre>':'')+'</div>';
}

function telaGestor(){
  const d = E.dados;
  const vs = (d.viagens||[]).slice().sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
  const abertas = d.abertas || [];
  const pgs = (d.pagamentos||[]).slice().sort((a,b)=>String(b.ate).localeCompare(String(a.ate)));

  let h = '<div class="navmes">'+
    '<button class="seta" data-acao="mes" data-passo="-1">‹</button><span>'+rotuloMes(E.mes)+'</span>'+
    '<button class="seta" data-acao="mes" data-passo="1">›</button></div>'+
    '<p class="total">'+moeda(soma(vs))+'</p>'+
    '<p style="font-size:14px;color:#7F9AAC;margin:0 0 6px">'+vs.length+(vs.length===1?" viagem no mês":" viagens no mês")+'</p>'+
    '<p style="font-size:14px;color:var(--ida);margin:0 0 20px">'+moeda(soma(abertas))+' em aberto no total, '+
      abertas.length+(abertas.length===1?" viagem":" viagens")+'</p>';

  // ——— fechamento por motorista ———
  h += '<p class="dia" style="font-size:20px;margin-bottom:8px">A pagar</p>';
  if(!abertas.length) h += '<p style="font-size:14px;color:var(--apagado);margin-bottom:20px">Nada em aberto. Tudo fechado.</p>';
  for(const m of (d.motoristas||[])){
    const dele = abertas.filter(v=>v.motorista===m.id);
    if(!dele.length) continue;
    const datas = dele.map(v=>v.data).sort();
    h += '<div style="padding:10px 0;border-bottom:1px solid var(--linha)">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="flex:1;font-size:16px">'+esc(m.nome)+
          '<br><span style="font-size:12px;color:var(--apagado)">'+dele.length+
          (dele.length===1?" viagem":" viagens")+' desde '+curto(datas[0])+'</span></span>'+
        '<span style="font-family:var(--cond);font-size:26px;color:var(--ida);font-variant-numeric:tabular-nums">'+moeda(soma(dele))+'</span>'+
        '<button class="acao mini" data-acao="abrirFechamento" data-id="'+m.id+'">fechar</button>'+
      '</div>';
    if(E.fechando && E.fechando.id === m.id){
      const entram = dele.filter(v => v.data <= E.fechando.ate);
      h += '<div class="caixa" style="margin-top:10px">'+
        '<p style="font-size:13px;color:var(--fraco);margin:0 0 8px">Fechar viagens até o dia:</p>'+
        '<input type="date" id="fAte" class="campo" value="'+E.fechando.ate+'" data-acao="nada">'+
        '<p style="font-size:14px;margin:10px 0 0">Entram <strong>'+entram.length+'</strong> '+
          (entram.length===1?"viagem":"viagens")+' · <strong>'+moeda(soma(entram))+'</strong></p>'+
        '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="acao" data-acao="confirmarFechamento" data-id="'+m.id+'">Confirmar pagamento</button>'+
          '<button class="link" data-acao="cancelarFechamento">cancelar</button></div>'+
        '<p style="font-size:12px;color:var(--apagado);margin:12px 0 0;line-height:1.5">'+
          'As viagens entram no pagamento e saem do "a pagar". O motorista passa a ver como recebido.</p></div>';
    }
    h += '</div>';
  }

  // ——— histórico de pagamentos ———
  h += '<p class="dia" style="font-size:20px;margin:24px 0 8px">Pagamentos</p>';
  if(!pgs.length) h += '<p style="font-size:14px;color:var(--apagado)">Nenhum pagamento fechado ainda.</p>';
  for(const p of pgs.slice(0,20)){
    h += '<div class="viagem">'+
      '<span style="flex:1;font-size:14px">'+esc(p.nome)+
        '<br><span style="font-size:12px;color:var(--apagado)">'+curto(p.de)+' a '+curto(p.ate)+' · '+
        p.qtd+(p.qtd===1?" viagem":" viagens")+' · pago em '+esc(String(p.pagoEm).split(" ")[0])+'</span></span>'+
      '<span class="valor" style="color:var(--volta)">'+moeda(p.valor)+'</span>'+
      '<button class="acao mini" data-acao="desfazerPagamento" data-id="'+esc(p.id)+'">desfazer</button></div>';
  }

  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:20px 0">'+
    '<button class="acao" data-acao="csvViagens">Copiar viagens</button>'+
    '<button class="acao" data-acao="csvPagamentos">Copiar pagamentos</button>'+
    '<button class="acao" data-acao="recarregar">Atualizar</button>'+
    '<button class="acao" data-acao="testar">Testar conexão</button></div>';

  if(E.diagnostico) h += '<pre>'+esc(E.diagnostico)+'</pre>';
  if(E.csv) h += '<pre>'+esc(E.csv)+'</pre>';

  // ——— cadastro ———
  h += '<p class="dia" style="font-size:20px;margin-bottom:8px">Motoristas</p>';
  for(const m of (d.motoristas||[])){
    h += '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linha)">'+
      '<span style="flex:1;font-size:15px">'+esc(m.nome)+
        '<br><span style="font-size:12px;color:var(--apagado)">tarifa '+moeda(m.tarifa)+'</span></span>'+
      '<button class="acao mini" data-acao="copiarLink" data-id="'+m.id+'">link</button>'+
      '<button class="acao mini" data-acao="tarifa" data-id="'+m.id+'" data-tarifa="'+m.tarifa+'">tarifa</button>'+
      '<button class="acao mini" data-acao="rmMotorista" data-id="'+m.id+'">remover</button></div>';
  }
  h += '<div style="display:flex;gap:8px;margin:12px 0 26px;flex-wrap:wrap">'+
    '<input id="nMotorista" class="campo" placeholder="Nome" style="flex:1;min-width:120px">'+
    '<input id="nTarifa" class="campo" inputmode="decimal" placeholder="Tarifa" style="width:96px">'+
    '<button class="acao" data-acao="addMotorista">Adicionar</button></div>';

  h += '<p class="dia" style="font-size:20px;margin-bottom:8px">Viagens de '+rotuloMes(E.mes)+'</p>';
  h += listar(vs, {nome:true, cancelar:"cancelarG"});
  return h;
}

function listar(vs, op){
  if(!vs.length) return '<p style="font-size:14px;color:var(--apagado)">Nenhuma viagem neste mês.</p>';
  const dias = {};
  vs.forEach(v => { (dias[v.data] = dias[v.data] || []).push(v); });
  let h = "";
  for(const d of Object.keys(dias).sort((a,b)=>b.localeCompare(a))){
    h += '<div style="margin-bottom:16px"><p class="dia">'+rotuloDia(d)+' · '+moeda(soma(dias[d]))+'</p>';
    for(const v of dias[d]){
      const t = TIPOS[v.tipo] || TIPOS.extra;
      const pago = !!v.pagamento;
      const meio = [op.nome ? v.nome : "", v.descricao].filter(Boolean).join(" · ");
      // viagem paga não se cancela; motorista só cancela o que lançou hoje
      const podeCancelar = !pago && (op.cancelar === "cancelarG" ||
        (E.dados && E.dados.hoje && String(v.enviado).indexOf(E.dados.hoje) === 0));
      h += '<div class="viagem"'+(pago?' style="opacity:.62"':'')+'>'+
        '<span class="hora">'+esc(v.hora)+'</span>'+
        '<span class="tipo" style="color:'+t.cor+'">'+t.sigla+'</span>'+
        '<span class="meio">'+esc(meio)+(pago?'<span class="selo">pago</span>':'')+'</span>'+
        '<span class="valor">'+moeda(v.valor)+'</span>'+
        (podeCancelar ? '<button class="acao mini" data-acao="'+op.cancelar+'" data-id="'+esc(v.id)+'">cancelar</button>' : '')+
      '</div>';
    }
    h += '</div>';
  }
  return h;
}

/* ————— ações ————— */
const ACOES = {
  nada(){},
  abrirCarimbo(){ E.carimbo.manual = true; pintar(); },
  fecharCarimbo(){
    const d = document.getElementById("cData"), h = document.getElementById("cHora");
    if(d && d.value) E.carimbo.data = d.value;
    if(h && h.value) E.carimbo.hora = h.value;
    E.carimbo.manual = false; pintar();
  },
  mes(b){ E.mes = mover(E.mes, Number(b.dataset.passo)); E.csv = null; E.diagnostico = null; carregar(); },
  recarregar(){ E.aviso = null; E.diagnostico = null; E.podeRepetir = false; carregar(); },

  tocar(b){
    if(E.ocupado) return;
    const tipo = b.dataset.tipo;
    if(tipo === "extra"){ E.extraAberto = true; pintar(); return; }
    registrar(tipo, null, "");
  },
  cancelarExtra(){ E.extraAberto = false; pintar(); },
  salvarExtra(){
    const v = (document.getElementById("eValor")||{}).value || "";
    const d = ((document.getElementById("eDesc")||{}).value || "").trim();
    if(!Number(String(v).replace(",","."))){ E.aviso = "Informe o valor da viagem extra."; E.avisoBom = false; return pintar(); }
    if(!d){ E.aviso = "Escreva uma descrição curta da viagem extra."; E.avisoBom = false; return pintar(); }
    registrar("extra", v, d);
  },

  async cancelar(b){
    if(!confirm("Cancelar esta viagem?")) return;
    await remover({acao:"cancelar", t:E.token, id:b.dataset.id});
  },
  async cancelarG(b){
    if(!confirm("Cancelar esta viagem?")) return;
    await remover({acao:"cancelar_g", pin:E.pin, id:b.dataset.id});
  },

  abrirFechamento(b){
    E.fechando = {id: b.dataset.id, ate: (E.dados.hojeISO || hojeISO())};
    E.csv = null; pintar();
  },
  cancelarFechamento(){ E.fechando = null; pintar(); },
  async confirmarFechamento(b){
    const campo = document.getElementById("fAte");
    const ate = campo && campo.value ? campo.value : (E.dados.hojeISO || hojeISO());
    if(!confirm("Confirmar o pagamento das viagens até "+curto(ate)+"?")) return;
    E.ocupado = true; E.aviso = "Fechando pagamento…"; E.avisoBom = true; pintar();
    try{
      const r = await chamar({acao:"fechar_pagamento", pin:E.pin, motorista:b.dataset.id, ate:ate}, 2);
      if(r.ok){
        E.fechando = null;
        E.aviso = "Pagamento fechado: "+r.qtd+(r.qtd===1?" viagem, ":" viagens, ")+moeda(r.valor)+".";
        E.avisoBom = true;
        await carregar();
      } else { E.aviso = r.erro; E.avisoBom = false; E.ocupado = false; pintar(); }
    } catch(e){ E.aviso = "Não deu para fechar agora: "+e.message; E.avisoBom = false; E.ocupado = false; pintar(); }
  },
  async desfazerPagamento(b){
    if(!confirm("Desfazer este pagamento? As viagens voltam para o 'a pagar'.")) return;
    E.ocupado = true; E.aviso = "Desfazendo…"; E.avisoBom = true; pintar();
    try{
      const r = await chamar({acao:"desfazer_pagamento", pin:E.pin, id:b.dataset.id}, 2);
      if(r.ok){ E.aviso = "Pagamento desfeito."; E.avisoBom = true; await carregar(); }
      else { E.aviso = r.erro; E.avisoBom = false; E.ocupado = false; pintar(); }
    } catch(e){ E.aviso = "Não deu para desfazer agora: "+e.message; E.avisoBom = false; E.ocupado = false; pintar(); }
  },

  sair(){
    if(!confirm("Sair deste acesso neste celular?")) return;
    try { localStorage.removeItem("cf_motorista"); } catch(e){}
    location.href = location.origin + location.pathname;
  },

  criarPin(){
    const p = (document.getElementById("pin")||{}).value || "";
    if(!/^\d{4}$/.test(p)){ E.aviso = "O PIN precisa ter 4 dígitos."; E.avisoBom = false; return pintar(); }
    chamar({acao:"definir_pin", pin:p}).then(r => {
      if(r.ok){ E.pin = p; E.semPin = false; E.liberado = true; localStorage.setItem("cf_pin", p); carregar(); }
      else { E.aviso = r.erro; E.avisoBom = false; pintar(); }
    }).catch(e => { E.aviso = e.message; E.avisoBom = false; pintar(); });
  },
  entrar(){
    E.pin = (document.getElementById("pin")||{}).value || "";
    E.aviso = null; carregar();
  },

  async testar(){
    E.diagnostico = "Testando…"; pintar();
    try{
      const r = await chamar({acao:"ping"}, 2);
      E.diagnostico = "Conexão OK\n" + JSON.stringify(r, null, 2);
    } catch(e){
      E.diagnostico = "Falhou: " + e.message +
        "\n\nConfira se a implantação está como “Qualquer pessoa” e se o endereço termina em /exec.";
    }
    pintar();
  },

  csvViagens(){
    const vs = (E.dados.viagens||[]).slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    const pagos = {};
    (E.dados.pagamentos||[]).forEach(p => { pagos[p.id] = p; });
    const linhas = ["motorista;data;hora;tipo;valor;descricao;enviado_em;situacao;pago_em"].concat(vs.map(v => {
      const [a,m,d] = v.data.split("-");
      const p = v.pagamento ? pagos[v.pagamento] : null;
      return [v.nome, d+"/"+m+"/"+a, v.hora, (TIPOS[v.tipo]||{}).sigla||v.tipo,
              Number(v.valor).toFixed(2).replace(".",","), v.descricao, v.enviado,
              v.pagamento ? "pago" : "em aberto", p ? String(p.pagoEm).split(" ")[0] : ""].join(";");
    }));
    copiarCsv(linhas.join("\n"), "Viagens do mês copiadas.");
  },
  csvPagamentos(){
    const pgs = (E.dados.pagamentos||[]).slice().sort((a,b)=>String(a.ate).localeCompare(String(b.ate)));
    const linhas = ["motorista;periodo_de;periodo_ate;viagens;valor;pago_em;observacao"].concat(pgs.map(p => {
      return [p.nome, curto(p.de)+"/"+String(p.de).slice(0,4), curto(p.ate)+"/"+String(p.ate).slice(0,4),
              p.qtd, Number(p.valor).toFixed(2).replace(".",","), p.pagoEm, p.obs].join(";");
    }));
    copiarCsv(linhas.join("\n"), "Pagamentos copiados — é o que vai para o dashboard financeiro.");
  },

  copiarLink(b){
    const url = location.origin + location.pathname + "?m=" + b.dataset.id;
    if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
    E.aviso = "Link copiado: " + url; E.avisoBom = true; pintar();
  },
  addMotorista(){
    const n = (document.getElementById("nMotorista")||{}).value || "";
    const t = (document.getElementById("nTarifa")||{}).value || "";
    if(!n.trim() || !Number(String(t).replace(",","."))){ E.aviso = "Informe nome e tarifa."; E.avisoBom = false; return pintar(); }
    chamar({acao:"add_motorista", pin:E.pin, nome:n, tarifa:t}).then(r => {
      if(r.ok){ E.aviso = "Motorista cadastrado. Use “link” para mandar o acesso dele."; E.avisoBom = true; }
      else { E.aviso = r.erro; E.avisoBom = false; }
      carregar();
    }).catch(e => { E.aviso = e.message; E.avisoBom = false; pintar(); });
  },
  tarifa(b){
    const nova = prompt("Nova tarifa por viagem (vale só para as próximas)", b.dataset.tarifa);
    if(!nova) return;
    chamar({acao:"edit_motorista", pin:E.pin, id:b.dataset.id, tarifa:nova}).then(()=>carregar());
  },
  rmMotorista(b){
    if(!confirm("Remover este motorista?")) return;
    chamar({acao:"rm_motorista", pin:E.pin, id:b.dataset.id}).then(r => {
      if(!r.ok){ E.aviso = r.erro; E.avisoBom = false; }
      carregar();
    });
  }
};

function copiarCsv(texto, recado){
  E.csv = texto;
  if(navigator.clipboard) navigator.clipboard.writeText(texto).catch(()=>{});
  E.aviso = recado + " Cole no Excel e separe por ponto e vírgula.";
  E.avisoBom = true;
  pintar();
}

async function registrar(tipo, valor, descricao){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const p = {acao:"registrar", t:E.token, id:id, tipo:tipo,
             data:E.carimbo.data, hora:E.carimbo.hora, valor:valor, descricao:descricao};
  E.ocupado = true; E.aviso = "Enviando…"; E.avisoBom = true; pintar();
  try{
    const r = await chamar(p);
    if(r.ok){
      E.extraAberto = false;
      E.carimbo = {data: hojeISO(), hora: agoraHM(), manual:false};
      E.aviso = TIPOS[tipo].rotulo + " registrada às " + p.hora + "."; E.avisoBom = true;
      await carregar();
    } else {
      E.aviso = "Não registrou: " + r.erro; E.avisoBom = false; E.ocupado = false; pintar();
    }
  } catch(err){
    const f = fila(); f.push(p); setFila(f);
    E.extraAberto = false;
    E.aviso = "Sem internet agora. A viagem ficou guardada no celular e sobe sozinha quando a conexão voltar.";
    E.avisoBom = true; E.ocupado = false; pintar();
  }
}

async function remover(params){
  E.ocupado = true; E.aviso = "Cancelando…"; E.avisoBom = true; pintar();
  try{
    const r = await chamar(params, 2);
    if(r.ok){ E.aviso = "Viagem cancelada."; E.avisoBom = true; await carregar(); }
    else { E.aviso = r.erro; E.avisoBom = false; E.ocupado = false; pintar(); }
  } catch(e){
    E.aviso = "Não deu para cancelar agora: " + e.message; E.avisoBom = false; E.ocupado = false; pintar();
  }
}

document.getElementById("app").addEventListener("click", ev => {
  const b = ev.target.closest("[data-acao]");
  if(b && ACOES[b.dataset.acao]) ACOES[b.dataset.acao](b);
});
document.getElementById("app").addEventListener("change", ev => {
  if(ev.target.id === "fAte" && E.fechando){ E.fechando.ate = ev.target.value; pintar(); }
});
window.addEventListener("online", () => esvaziarFila().then(m => { if(m) carregar(); }));
setInterval(() => { if(!E.carimbo.manual && !E.ocupado){ E.carimbo.data = hojeISO(); E.carimbo.hora = agoraHM(); } }, 20000);

carregar();
</script>
